name: Build

on:
  push:
    branches: [main, 'source/volchay-con-pro']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux smoke build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-declarative-dev libqt6svg6-dev libqt6core5compat6-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates \
            qml6-module-qt5compat-graphicaleffects qml6-module-qt-labs-platform \
            qml6-module-qtqml-workerscript qml6-module-qtcore qml6-module-qtquick-shapes \
            libgl-dev libegl-dev libglu1-mesa-dev mesa-common-dev \
            libxkbcommon-dev libfontconfig1-dev libxrender-dev libfreetype-dev \
            cmake ninja-build g++ \
            ffmpeg

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

  windows:
    name: Windows build (.exe + windeployqt)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qt5compat qtshadertools qtimageformats'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Stage release directory
        shell: cmd
        run: |
          mkdir dist\Volchay-con-pro
          copy build\Volchay-con-pro.exe dist\Volchay-con-pro\
          windeployqt.exe --release --qmldir qml --no-translations --no-system-d3d-compiler --no-opengl-sw dist\Volchay-con-pro\Volchay-con-pro.exe

      - name: Bundle ffmpeg.exe
        shell: pwsh
        run: |
          # Lightweight static ffmpeg essentials build (gyan.dev) — ~30 MB,
          # enough for libx264 + libgif + palettegen.
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $dst = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRedirection 5
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $exe = Get-ChildItem -Recurse -Path $dst -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe not found in archive' }
          Copy-Item $exe.FullName -Destination dist\Volchay-con-pro\ffmpeg.exe
          Get-Item dist\Volchay-con-pro\ffmpeg.exe | Format-List Length, FullName

      - name: Zip artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Volchay-con-pro\* -DestinationPath dist\Volchay-con-pro-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Volchay-con-pro-windows-x64
          path: dist/Volchay-con-pro-windows-x64.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Volchay-con-pro-windows-x64.zip
          generate_release_notes: true
